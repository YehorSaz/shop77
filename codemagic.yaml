workflows:
  ios-build:
    name: iOS Build (Unsigned)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: 16.0
      cocoapods: default
    scripts:
      - name: Verify and print Node version
        script: |
          node -v
          npm -v
      - name: Clear sub-node_modules
        script: |
          rm -rf node_modules package-lock.json
          npm cache clean --force
      - name: Install dependencies
        script: |
          npm install
      - name: Fix Reanimated version check
        script: |
          sed -i '' 's/assert_minimal_react_native_version/# assert_minimal_react_native_version/g' node_modules/react-native-reanimated/RNReanimated.podspec || true
      - name: Install CocoaPods
        script: |
          cd ios
          pod repo update
          pod install
      - name: Build iOS Application (Unsigned)
        script: |
          # Запускаємо чисту збірку в спеціальну папку всередині проєкту
          xcodebuild -workspace ios/shop77.xcworkspace \
                     -scheme shop77 \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build_output \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build
          
          # Створюємо правильну структуру та архівуємо в .ipa для AltStore
          mkdir -p Payload
          cp -r build_output/Build/Products/Release-iphoneos/shop77.app Payload/
          zip -r shop77.ipa Payload
    artifacts:
      - "*.ipa"
