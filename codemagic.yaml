workflows:
  ios-build:
    name: iOS Build (Unsigned)
    max_build_duration: 30
    instance_type: mac_mini_m1
    environment:
      node: 20.x
      xcode: 15.4
      cocoapods: 1.15.2
    scripts:
      - name: Clear sub-node_modules and fix reanimated
        script: |
          # Очищаємо кеш npm та видаляємо старі модулі перед інсталяцією
          rm -rf node_modules package-lock.json
          npm cache clean --force
      - name: Install dependencies
        script: |
          npm install
      - name: Install CocoaPods
        script: |
          cd ios
          pod repo update
          pod install
      - name: Build iOS Application (Unsigned)
        script: |
          xcodebuild -workspace ios/shop77.xcworkspace \
                     -scheme shop77 \
                     -configuration Release \
                     -sdk iphoneos \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build
    artifacts:
      - build/Build/Products/Release-iphoneos/*.app
